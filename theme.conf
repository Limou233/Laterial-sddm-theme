# Laterial SDDM theme
# Plasma 6 "Login Screen (SDDM)" writes its wallpaper choice to
# theme.conf.user/[General]/background. Keep background in [General].

[General]
colorMode=monet
manualScheme=Green
customPrimary=
colorScheme=dark
background=assets/default-wallpaper.svg
backgroundFillMode=cover
defaultUser=
clockFormat=12h
blurEnabled=true
panelBlurStrength=80
animationsEnabled=true
showClock=true

[Colors]
# Optional Material color-role overrides in manual mode.
# Blank values use the selected MD scheme's defaults.
primary=
onPrimary=
primaryContainer=
onPrimaryContainer=
secondary=
secondaryContainer=
surface=
surfaceContainer=
surfaceContainerHigh=
onSurface=
onSurfaceVariant=
outline=
outlineVariant=
error=
onError=

[Overrides]
# Optional component-level overrides. Monet mode ignores this whole section.
loginButton.background=
loginButton.text=
dialog.surface=
dialog.outline=
dialog.shadow=
input.background=
input.text=
input.label=
input.outline=
input.focus=
revealButton.text=
session.background=
session.popupBackground=
session.text=
power.background=
power.text=
clock.text=
clock.secondaryText=
error.text=
